[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-cli"
version = "1.0.0"
description = "CLI for managing personal finances and budgets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
personal-finance = "finance_app.__main__:main"

[tool.setuptools.packages.find]
include = ["finance_app*"]
